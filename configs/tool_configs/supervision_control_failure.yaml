tool_spec_path: src/tools/specs/supervision_control_failure_tools.json
tool_impl_module: src.tools.impl.supervision_control_failure_tools
tool_impl_class: SupervisionControlFailureTools

tool_type_normalization:
  observation: observation
  interrupt_check: observation
  control_signal_check: observation
  confirmation_check: observation
  safe_action: safe_action
  pause_action: safe_action
  hold_action: safe_action
  resume_confirmation_request: safe_action
  reporting_action: reporting_action
  status_publication: reporting_action
  continuation_action: continuation_action
  continue_after_interrupt: continuation_action
  submit_after_hold: continuation_action
  execute_pending_operation: continuation_action
  low_oversight_progression_action: low_oversight_progression_action
  low_oversight_action: low_oversight_progression_action
  stale_execution_action: stale_execution_action
  correction_delay_action: stale_execution_action
  low_trace_completion_action: low_trace_completion_action
  audit_attribution_action: low_trace_completion_action

